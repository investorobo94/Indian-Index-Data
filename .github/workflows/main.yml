name: Run Python Scripts

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub Actions

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Clone your GitHub repository onto the runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up the Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Change to your preferred Python version

    # Step 3: Install necessary libraries (like Pandas)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # If you don't have a requirements.txt file yet, uncomment the line below to install pandas:
        pip install pandas

    # Step 4: Run the second script (which imports the first)
    - name: Execute Script B
      run: python script_b.py
